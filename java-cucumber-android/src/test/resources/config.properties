# ─────────────────────────────────────────────────────────────────────────────
# Appium / Device configuration
# Override any value by passing -Dkey=value to Maven, e.g.:
#   mvn test -Ddevice.name="Pixel_6_API_33" -Dplatform.version=13
# ─────────────────────────────────────────────────────────────────────────────

# Appium server URL
appium.url=http://localhost:4723

# Android device / emulator settings
device.name=Android Emulator
platform.version=13

# Target application
app.package=com.wdiodemoapp
app.activity=.MainActivity

# Path to the APK file (relative to the project root, or absolute).
# Leave empty to launch the app that is already installed on the device.
app.path=../apps/wdioNativeDemoApp.apk
