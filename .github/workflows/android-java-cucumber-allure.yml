name: Android – Java Cucumber TestNG Allure

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["java-cucumber-android/**"]
  pull_request:
    branches: [main, master]
    paths: ["java-cucumber-android/**"]

jobs:
  android-cucumber-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: java-cucumber-android

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium 2 + UIAutomator2 driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium server
        run: nohup appium --log-level info --log appium-server.log & sleep 10

      - name: Run tests on Android Emulator (API 33)
        uses: reactivecircus/android-emulator-runner@v2.32.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r ../apps/wdioNativeDemoApp.apk
            mvn test \
              -Dapp.path="$(pwd)/../apps/wdioNativeDemoApp.apk" \
              -Ddevice.name="Android Emulator" \
              -Dplatform.version=13

      - name: Generate Allure report
        if: always()
        run: mvn allure:report -q || true

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: java-cucumber-android/target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: java-cucumber-android/target/allure-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: java-cucumber-android/appium-server.log
          if-no-files-found: warn
